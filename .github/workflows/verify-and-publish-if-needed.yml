name: Verify and publish if needed

on:
  push:
    branches:
      - '**'
  workflow_call:

# The slow test suites run in jobs of their own, alongside the build, and the release waits for all of them
jobs:
  build:
    name: Build, typecheck and unit test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Validate message of latest commit with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Set version number for release
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: scripts/update-version-number.ts

      - name: Build project
        run: yarn build

      # We check types after building because GraphQL related types are generated during build
      - name: TypeScript check
        run: |
          yarn tsc --version
          yarn typecheck

      # The root package.json's test script, less tv-ui's integration tests (the integration job runs those)
      - name: Run unit tests
        run: |
          yarn --cwd packages/repo test
          yarn --cwd packages/mock-stash test
          yarn --cwd packages/tv-ui test --project unit
          yarn --cwd packages/tv-plugin test

      # What the release job publishes: the plugin as built here, and package.json for the version it was built with
      - name: Upload built plugin for release
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: |
            package.json
            packages/tv-plugin/dist
          if-no-files-found: error

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs
          path: ~/.npm/_logs/*
          if-no-files-found: ignore

  # Each Stash version's tests run in jobs of their own, all in parallel (see docs/stash-compatibility.md). Develop is
  # supported on a best-effort basis: its jobs run and show their result, but can't block a release. A job for develop
  # stops straight away when develop's commit is one of the releases', whose jobs cover it.
  integration:
    name: Integration tests (Stash ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.version == 'develop' }}
    strategy:
      # Let them all finish, so a failure shows which Stash versions it affects
      fail-fast: false
      matrix:
        version: [develop, latest-release, previous-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Stash version is tested
        id: version
        uses: ./.github/actions/check-stash-version
        with:
          version: ${{ matrix.version }}

      - name: Set up project
        if: steps.version.outputs.tested == 'true'
        uses: ./.github/actions/setup

      - name: Run integration tests
        if: steps.version.outputs.tested == 'true'
        run: yarn --cwd packages/tv-ui test --project integration-stash-${{ matrix.version }}

  # mock-stash against the real Stash of each version, in Docker
  conformance:
    name: Conformance tests (Stash ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.version == 'develop' }}
    strategy:
      fail-fast: false
      matrix:
        version: [develop, latest-release, previous-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Stash version is tested
        id: version
        uses: ./.github/actions/check-stash-version
        with:
          version: ${{ matrix.version }}

      - name: Set up project
        if: steps.version.outputs.tested == 'true'
        uses: ./.github/actions/setup

      - name: Run conformance tests
        if: steps.version.outputs.tested == 'true'
        env:
          # Fail rather than skip if Docker isn't available
          REQUIRE_DOCKER: 1
        run: yarn --cwd packages/mock-stash test:conformance --project conformance-stash-${{ matrix.version }}

  # The built plugin in the real Stash of each version, in Docker
  plugin:
    name: Plugin in Stash (Stash ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.version == 'develop' }}
    strategy:
      fail-fast: false
      matrix:
        version: [develop, latest-release, previous-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Stash version is tested
        id: version
        uses: ./.github/actions/check-stash-version
        with:
          version: ${{ matrix.version }}

      - name: Set up project
        if: steps.version.outputs.tested == 'true'
        uses: ./.github/actions/setup

      # Built here rather than waiting for the build job's, which would hold up every plugin job. stash-ui is already
      # built by the setup.
      - name: Build plugin
        if: steps.version.outputs.tested == 'true'
        run: |
          yarn --cwd packages/tv-ui build
          yarn --cwd packages/tv-plugin build

      - name: Get Playwright version
        id: playwright
        if: steps.version.outputs.tested == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright's browsers
        if: steps.version.outputs.tested == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser
        if: steps.version.outputs.tested == 'true'
        working-directory: packages/tv-plugin
        run: npx playwright install --with-deps chromium

      - name: Run plugin tests
        if: steps.version.outputs.tested == 'true'
        env:
          REQUIRE_DOCKER: 1
        run: yarn --cwd packages/tv-plugin test:real-stash --project stash-${{ matrix.version }}

      - name: Upload report on failure
        if: failure() && steps.version.outputs.tested == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-report-${{ matrix.version }}
          path: |
            packages/tv-plugin/playwright-report
            packages/tv-plugin/test-results
          if-no-files-found: ignore

  # Against each release, not develop: the other tiers cover develop, and these are the slowest tests to run again
  e2e:
    name: E2E tests (Stash ${{ matrix.version }}, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [latest-release, previous-release]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Skips downloading browsers already restored, but still installs the system packages they need
      - name: Install browser for E2E tests
        working-directory: packages/tv-ui
        run: npx playwright install --with-deps chromium

      # Playwright starts mock-stash and the dev server itself (see packages/tv-ui/playwright.config.ts)
      - name: Run E2E tests
        env:
          # The runner has 4 cores, and each worker runs a browser playing video
          E2E_WORKERS: 2
          E2E_STASH_VERSION: ${{ matrix.version }}
        run: yarn test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.version }}-shard-${{ matrix.shard }}
          path: |
            packages/tv-ui/playwright-report
            packages/tv-ui/test-results
          if-no-files-found: ignore

  release:
    name: Release
    needs: [build, integration, conformance, plugin, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: node
        if: needs.build.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      # Shared with the other jobs' setup (.github/actions/setup)
      - name: Restore node_modules
        if: needs.build.outputs.release == 'true'
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}

      # For semantic-release and its plugins
      - name: Install project packages
        if: needs.build.outputs.release == 'true'
        run: yarn install --frozen-lockfile

      - name: Download built plugin
        if: needs.build.outputs.release == 'true'
        uses: actions/download-artifact@v7
        with:
          name: plugin

      - name: Release
        if: needs.build.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Print publish info
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [[ ! "$VERSION" == 0.0.0* ]]; then
            prefix_message="Published new version:"
            echo -e "### :rocket: $prefix_message \n\`\`\`\n$VERSION\n\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo -e "$prefix_message\n\e[1m$VERSION\e[0m"
          else
            message="No publishable changes made since last version"
            echo "### $message" >> $GITHUB_STEP_SUMMARY
            echo -e "\e[1m$message\e[0m"
          fi
