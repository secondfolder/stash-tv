name: Verify and publish if needed

on:
  push:
    branches:
      - '**'
  workflow_call:

jobs:
  lint:
    name: Verify and publish if needed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: stash-tv

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Setup ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Print versions
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version
          ffmpeg -version | head -n 1

      - name: Install project packages
        working-directory: stash-tv
        run: |
          yarn install --frozen-lockfile
          yarn --cwd packages/stash-ui setup

      - name: Validate message of latest commit with commitlint
        if: github.event_name == 'push'
        working-directory: stash-tv
        run: npx commitlint --last --verbose

      - name: Set version number for release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        working-directory: stash-tv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: scripts/update-version-number.ts

      - name: Build project
        working-directory: stash-tv
        run: yarn build

      # We check types after building because GraphQL related types are generated during build
      - name: TypeScript check
        working-directory: stash-tv
        run: |
          yarn tsc --version
          yarn tsc --noEmit

      - name: Run tests
        working-directory: stash-tv
        run: yarn test

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        working-directory: stash-tv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Print publish info
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        working-directory: stash-tv
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [[ ! "$VERSION" == 0.0.0* ]]; then
            prefix_message="Published new version:"
            echo -e "### :rocket: $prefix_message \n\`\`\`\n$VERSION\n\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo -e "$prefix_message\n\e[1m$VERSION\e[0m"
          else
            message="No publishable changes made since last version"
            echo "### $message" >> $GITHUB_STEP_SUMMARY
            echo -e "\e[1m$message\e[0m"
          fi

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs
          path: ~/.npm/_logs/*
          if-no-files-found: ignore
