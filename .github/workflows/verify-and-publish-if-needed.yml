name: Verify and publish if needed

on:
  push:
    branches:
      - '**'
  workflow_call:

# The slow test suites run in jobs of their own, alongside the build, and the release waits for all of them
jobs:
  build:
    name: Build, typecheck and unit test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Validate message of latest commit with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Set version number for release
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: scripts/update-version-number.ts

      - name: Build project
        run: yarn build

      # We check types after building because GraphQL related types are generated during build
      - name: TypeScript check
        run: |
          yarn tsc --version
          yarn typecheck

      # The root package.json's test script, less tv-ui's integration tests (the integration job runs those)
      - name: Run unit tests
        run: |
          yarn --cwd packages/repo test
          yarn --cwd packages/mock-stash test
          yarn --cwd packages/tv-ui test --project unit
          yarn --cwd packages/tv-plugin test

      # What the release job publishes: the plugin as built here, and package.json for the version it was built with
      - name: Upload built plugin for release
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: |
            package.json
            packages/tv-plugin/dist
          if-no-files-found: error

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs
          path: ~/.npm/_logs/*
          if-no-files-found: ignore

  integration:
    name: Integration tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # Let both finish, so a failure shows which Stash versions it affects
      fail-fast: false
      matrix:
        project: [integration-stash-develop, integration-stash-stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Run integration tests
        run: yarn --cwd packages/tv-ui test --project ${{ matrix.project }}

  e2e:
    name: E2E tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Skips downloading browsers already restored, but still installs the system packages they need
      - name: Install browser for E2E tests
        working-directory: packages/tv-ui
        run: npx playwright install --with-deps chromium

      # Playwright starts mock-stash and the dev server itself (see packages/tv-ui/playwright.config.ts)
      - name: Run E2E tests
        env:
          # The runner has 4 cores, and each worker runs a browser playing video
          E2E_WORKERS: 2
        run: yarn test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: |
            packages/tv-ui/playwright-report
            packages/tv-ui/test-results
          if-no-files-found: ignore

  release:
    name: Release
    needs: [build, integration, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: node
        if: needs.build.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      # Shared with the other jobs' setup (.github/actions/setup)
      - name: Restore node_modules
        if: needs.build.outputs.release == 'true'
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}

      # For semantic-release and its plugins
      - name: Install project packages
        if: needs.build.outputs.release == 'true'
        run: yarn install --frozen-lockfile

      - name: Download built plugin
        if: needs.build.outputs.release == 'true'
        uses: actions/download-artifact@v7
        with:
          name: plugin

      - name: Release
        if: needs.build.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Print publish info
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [[ ! "$VERSION" == 0.0.0* ]]; then
            prefix_message="Published new version:"
            echo -e "### :rocket: $prefix_message \n\`\`\`\n$VERSION\n\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo -e "$prefix_message\n\e[1m$VERSION\e[0m"
          else
            message="No publishable changes made since last version"
            echo "### $message" >> $GITHUB_STEP_SUMMARY
            echo -e "\e[1m$message\e[0m"
          fi
