name: Set up project
description: Installs the tools and packages that building and testing need, and sets up and builds packages/stash-ui

runs:
  using: composite
  steps:
    - name: Setup Node.js
      id: node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    # Stash's UI (packages/stash-ui/stash) installs its dependencies with pnpm. pnpm switches
    # itself to the exact version pinned in Stash's packageManager field.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    # mock-stash generates its media fixtures with ffmpeg
    - name: Setup ffmpeg
      uses: AnimMouse/setup-ffmpeg@v1

    - name: Print versions
      shell: bash
      run: |
        git --version
        node --version
        yarn --version
        ffmpeg -version | head -n 1

    # Installing is then near-instant: yarn sees node_modules already matches yarn.lock
    - name: Restore node_modules
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}

    - name: Install project packages
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Set up stash-ui
      shell: bash
      run: yarn --cwd packages/stash-ui setup

    # The fingerprint ensure-ready compares with the stamp in dist/ to tell whether stash-ui needs building again
    - name: Fingerprint stash-ui's build inputs
      id: stash-ui
      shell: bash
      run: |
        source packages/stash-ui/scripts/fingerprint.sh
        echo "build-fingerprint=$(build_fingerprint)" >> "$GITHUB_OUTPUT"

    - name: Restore stash-ui build
      uses: actions/cache@v6
      with:
        path: packages/stash-ui/dist
        key: stash-ui-dist-${{ steps.stash-ui.outputs.build-fingerprint }}

    # Builds stash-ui, which everything else imports from, unless the restored build is up to date
    - name: Build stash-ui
      shell: bash
      run: yarn --cwd packages/stash-ui ensure-ready
